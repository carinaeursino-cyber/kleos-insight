<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>KLEOS INSIGHT™ — Panel</title>
  <meta name="robots" content="noindex, nofollow" />
  <link rel="preconnect" href="https://fonts.googleapis.com" />
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
  <link href="https://fonts.googleapis.com/css2?family=Playfair+Display:wght@400;500;600&family=Inter:wght@300;400;500&family=JetBrains+Mono:wght@300;400;500&display=swap" rel="stylesheet" />
  <style>
    :root {
      --obsidian: #050505; --card: #0B0B0C; --gold: #C5A059;
      --gold-15: rgba(197,160,89,.15); --gold-07: rgba(197,160,89,.07);
      --text: #F5F5F5; --text-60: rgba(245,245,245,.6); --text-40: rgba(245,245,245,.4);
      --serif: "Playfair Display", Georgia, serif;
      --sans: "Inter", system-ui, sans-serif;
      --mono: "JetBrains Mono", Consolas, monospace;
    }
    * { margin: 0; padding: 0; box-sizing: border-box; }
    body { background: var(--obsidian); color: var(--text); font-family: var(--sans); font-weight: 300; }
    .mono { font-family: var(--mono); }
    .wrap { max-width: 1100px; margin: 0 auto; padding: 2.5rem clamp(1rem, 4vw, 3rem) 5rem; }
    .top { display: flex; justify-content: space-between; align-items: baseline; margin-bottom: 2.5rem; flex-wrap: wrap; gap: 1rem; }
    .brand { font-family: var(--mono); font-size: .78rem; letter-spacing: .35em; color: var(--gold); }
    .tag { font-family: var(--mono); font-size: .58rem; letter-spacing: .3em; color: var(--text-40); }
    h1 { font-family: var(--serif); font-size: 1.9rem; font-weight: 500; margin-bottom: 2rem; }

    /* Login */
    .login { max-width: 380px; margin: 12vh auto 0; text-align: center; }
    .login input {
      width: 100%; background: var(--card); border: 1px solid var(--gold-15);
      color: var(--text); font-family: var(--mono); font-size: .85rem;
      padding: 1rem 1.2rem; outline: none; text-align: center; letter-spacing: .1em;
      margin-bottom: 1rem;
    }
    .login input:focus { border-color: var(--gold); }
    .btn {
      font-family: var(--mono); font-size: .72rem; letter-spacing: .22em; text-transform: uppercase;
      background: var(--gold); color: var(--obsidian); border: none; border-radius: 999px;
      padding: .95rem 2.2rem; cursor: pointer;
    }
    .err { font-family: var(--mono); font-size: .62rem; letter-spacing: .15em; color: #B0604D; margin-top: 1rem; min-height: 1em; }

    /* Stats */
    .stats { display: flex; gap: 1rem; margin-bottom: 2rem; flex-wrap: wrap; }
    .stat { border: 1px solid var(--gold-15); background: var(--card); padding: 1.2rem 1.6rem; min-width: 130px; }
    .stat .n { font-family: var(--serif); font-size: 1.8rem; color: var(--gold); }
    .stat .l { font-family: var(--mono); font-size: .55rem; letter-spacing: .25em; color: var(--text-40); margin-top: .3rem; }

    /* Tabla */
    table { width: 100%; border-collapse: collapse; }
    th { font-family: var(--mono); font-size: .56rem; letter-spacing: .25em; color: var(--gold);
         text-align: left; padding: .8rem .7rem; border-bottom: 1px solid var(--gold-15); white-space: nowrap; }
    td { font-size: .82rem; padding: .85rem .7rem; border-bottom: 1px solid var(--gold-07); color: var(--text-60); }
    tr.row { cursor: pointer; transition: background .25s; }
    tr.row:hover { background: var(--gold-07); }
    td.idx { font-family: var(--mono); color: var(--gold); }
    td.paid-yes { color: var(--gold); font-family: var(--mono); font-size: .68rem; letter-spacing: .15em; }
    td.paid-no { color: var(--text-40); font-family: var(--mono); font-size: .68rem; letter-spacing: .15em; }
    .empty { font-family: var(--mono); font-size: .68rem; letter-spacing: .2em; color: var(--text-40); padding: 3rem 0; text-align: center; }

    /* Detalle */
    .detail { display: none; }
    .back { font-family: var(--mono); font-size: .65rem; letter-spacing: .18em; color: var(--text-40);
            background: none; border: none; cursor: pointer; margin-bottom: 1.6rem; }
    .back:hover { color: var(--gold); }
    .dgrid { display: grid; grid-template-columns: repeat(auto-fit, minmax(240px, 1fr)); gap: 1rem; margin-bottom: 1.6rem; }
    .dcard { border: 1px solid var(--gold-15); background: var(--card); padding: 1.4rem 1.5rem; }
    .dcard .lab { font-family: var(--mono); font-size: .55rem; letter-spacing: .28em; color: var(--gold); margin-bottom: .7rem; }
    .dcard .val { font-size: .9rem; line-height: 1.7; color: var(--text-60); }
    .dcard .big { font-family: var(--serif); font-size: 2rem; color: var(--gold); }
    .dimrow { display: flex; justify-content: space-between; font-family: var(--mono); font-size: .72rem;
              padding: .45rem 0; border-bottom: 1px solid var(--gold-07); color: var(--text-60); }
    .qa { padding: .7rem 0; border-bottom: 1px solid var(--gold-07); }
    .qa .q { font-size: .75rem; color: var(--text-40); margin-bottom: .25rem; }
    .qa .a { font-size: .85rem; color: var(--text-60); }
    @media (max-width: 700px) {
      .hide-m { display: none; }
      td, th { padding: .7rem .4rem; }
    }
  </style>
</head>
<body>
  <div class="wrap">
    <div class="top">
      <span class="brand">KLEOS&nbsp;INSIGHT™</span>
      <span class="tag">PANEL&nbsp;·&nbsp;KIP-001</span>
    </div>

    <!-- Login -->
    <div class="login" id="login">
      <h1>Acceso restringido</h1>
      <input type="password" id="key-input" placeholder="CLAVE DE ADMINISTRACIÓN" />
      <button class="btn" id="btn-login">Entrar</button>
      <p class="err" id="login-err"></p>
    </div>

    <!-- Lista -->
    <div class="detail" id="list-view">
      <h1>Diagnósticos</h1>
      <div class="stats" id="stats"></div>
      <table>
        <thead>
          <tr>
            <th>FECHA</th><th>EMPRESA</th><th class="hide-m">EMAIL</th>
            <th>ÍNDICE</th><th class="hide-m">PATRÓN</th><th>PAGÓ</th>
          </tr>
        </thead>
        <tbody id="rows"></tbody>
      </table>
      <p class="empty" id="empty" style="display:none">SIN REGISTROS TODAVÍA</p>
    </div>

    <!-- Detalle -->
    <div class="detail" id="detail-view">
      <button class="back" id="btn-back">← VOLVER A LA LISTA</button>
      <h1 id="d-empresa"></h1>
      <div class="dgrid">
        <div class="dcard"><p class="lab">ÍNDICE KLEOS</p><p class="big" id="d-index"></p><p class="val" id="d-level"></p></div>
        <div class="dcard"><p class="lab">CONTACTO</p><p class="val" id="d-contacto"></p></div>
        <div class="dcard"><p class="lab">PATRÓN · PAGO</p><p class="val" id="d-meta"></p></div>
      </div>
      <div class="dgrid">
        <div class="dcard"><p class="lab">DIMENSIONES</p><div id="d-dims"></div></div>
        <div class="dcard"><p class="lab">INSIGHT DETECTADO</p><p class="val" id="d-insight"></p></div>
      </div>
      <div class="dgrid">
        <div class="dcard"><p class="lab">CAUSA RAÍZ</p><p class="val" id="d-diag"></p></div>
        <div class="dcard"><p class="lab">PRIORIDAD #1</p><p class="val" id="d-prio"></p></div>
      </div>
      <div class="dcard"><p class="lab">RESPUESTAS COMPLETAS</p><div id="d-respuestas"></div></div>
    </div>
  </div>

  <script>
    (() => {
      let KEY = sessionStorage.getItem("kleos_admin_key") || "";
      const $ = (id) => document.getElementById(id);

      function show(view) {
        $("login").style.display = view === "login" ? "block" : "none";
        $("list-view").style.display = view === "list" ? "block" : "none";
        $("detail-view").style.display = view === "detail" ? "block" : "none";
      }

      async function loadList() {
        const r = await fetch("/api/admin-data?key=" + encodeURIComponent(KEY));
        if (r.status === 403) {
          sessionStorage.removeItem("kleos_admin_key");
          $("login-err").textContent = "CLAVE INCORRECTA";
          show("login");
          return;
        }
        if (!r.ok) {
          $("login-err").textContent = "ERROR: ¿STORAGE CONFIGURADO?";
          show("login");
          return;
        }
        const data = await r.json();
        sessionStorage.setItem("kleos_admin_key", KEY);
        show("list");

        const total = data.records.length;
        const paid = data.records.filter((x) => x.paid).length;
        const avg = total ? Math.round(data.records.reduce((s, x) => s + (x.kleosIndex || 0), 0) / total) : 0;
        const ev = data.events || {};
        $("stats").innerHTML =
          `<div class="stat"><p class="n">${ev.startedProtocol || 0}</p><p class="l">INICIARON</p></div>` +
          `<div class="stat"><p class="n">${ev.completedProtocol || 0}</p><p class="l">COMPLETARON</p></div>` +
          `<div class="stat"><p class="n">${ev.openedResults || 0}</p><p class="l">VIERON RESULTADO</p></div>` +
          `<div class="stat"><p class="n">${ev.clickedUnlock || 0}</p><p class="l">CLICK DESBLOQUEO</p></div>` +
          `<div class="stat"><p class="n">${paid}</p><p class="l">PAGARON</p></div>` +
          `<div class="stat"><p class="n">${total}</p><p class="l">LEADS</p></div>` +
          `<div class="stat"><p class="n">${avg}</p><p class="l">ÍNDICE PROM.</p></div>` +
          `<div class="stat"><p class="n">${data.partials || 0}</p><p class="l">ABANDONOS</p></div>`;

        const tbody = $("rows");
        tbody.innerHTML = "";
        $("empty").style.display = total ? "none" : "block";
        data.records.forEach((rec) => {
          const tr = document.createElement("tr");
          tr.className = "row";
          const f = rec.fecha ? new Date(rec.fecha).toLocaleDateString("es-AR", { day: "2-digit", month: "2-digit", year: "2-digit" }) : "—";
          tr.innerHTML =
            `<td class="mono">${f}</td>` +
            `<td>${rec.empresa || "—"}</td>` +
            `<td class="hide-m">${rec.email || "—"}</td>` +
            `<td class="idx">${rec.kleosIndex ?? "—"}</td>` +
            `<td class="hide-m">${rec.pattern || "—"}</td>` +
            `<td class="${rec.paid ? "paid-yes" : "paid-no"}">${rec.paid ? "SÍ" : "NO"}</td>`;
          tr.addEventListener("click", () => loadDetail(rec.id));
          tbody.appendChild(tr);
        });
      }

      async function loadDetail(id) {
        const r = await fetch("/api/admin-data?key=" + encodeURIComponent(KEY) + "&id=" + encodeURIComponent(id));
        if (!r.ok) return;
        const d = await r.json();
        show("detail");
        $("d-empresa").textContent = d.empresa || "(sin empresa)";
        $("d-index").textContent = d.kleosIndex ?? "—";
        $("d-level").textContent = d.perceptionLevel || "";
        $("d-contacto").innerHTML = `${d.nombre || "—"}<br>${d.email || "—"}<br><span class="mono" style="font-size:.65rem;color:var(--text-40)">${d.fecha ? new Date(d.fecha).toLocaleString("es-AR") : ""}</span>`;
        $("d-meta").innerHTML = `${d.pattern || "—"}<br>` + (d.paid ? '<span style="color:var(--gold)">PAGADO</span>' : "NO PAGADO");
        $("d-dims").innerHTML = (d.dimensions || []).map((x) => `<div class="dimrow"><span>${x.name}</span><span>${x.score}/20</span></div>`).join("");
        $("d-insight").textContent = d.insightDetected || "—";
        $("d-diag").textContent = d.mainDiagnosis || "—";
        $("d-prio").textContent = d.priorityNumberOne || "—";
        $("d-respuestas").innerHTML = (d.declaraciones || []).map((x) => `<div class="qa"><p class="q">${x.q}</p><p class="a">→ ${x.a}</p></div>`).join("") || '<p class="val">—</p>';
      }

      $("btn-login").addEventListener("click", () => {
        KEY = $("key-input").value.trim();
        if (KEY) loadList();
      });
      $("key-input").addEventListener("keydown", (e) => { if (e.key === "Enter") $("btn-login").click(); });
      $("btn-back").addEventListener("click", () => show("list"));

      if (KEY) loadList();
      else show("login");
    })();
  </script>

</html>
